# 自动打包 App：每次推送都会生成一个能直接装到安卓手机上的测试版 APK，并检查 iOS 工程能否编译通过。
# 下载 APK：GitHub 仓库 → Actions → 「Build mobile apps」→ 点开最新一次运行 → 页面底部 Artifacts 里的 laiganjue-android-debug
# 说明见 docs/NATIVE_APP.md
name: Build mobile apps
on:
  push:
    paths:
      - 'src/**'
      - 'assets/**'
      - 'android/**'
      - 'ios/**'
      - 'scripts/build.mjs'
      - 'scripts/ios-try.sh'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android 测试版 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm test
      - run: npm run build:app
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: laiganjue-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS 编译检查（模拟器，无需签名）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:app
      - run: npx cap sync ios
      - run: xcodebuild -version
      - run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

  ios-try:
    name: iPhone 一键安装脚本自测（模拟新 Mac，不连手机）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # 像用户那样从标准输入运行脚本（等同 curl | bash），并隐藏预装的 Node，让脚本自己下载 Node 与代码
      - name: 运行 scripts/ios-try.sh
        env:
          LGJ_NO_DEVICE: '1'
          LGJ_DIR: ${{ runner.temp }}/laiganjue
          LGJ_BRANCH: ${{ github.ref_name }}
        run: env PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/bash < scripts/ios-try.sh
      - name: 再运行一次（已有代码与 Node 时应直接复用）
        env:
          LGJ_NO_DEVICE: '1'
          LGJ_DIR: ${{ runner.temp }}/laiganjue
          LGJ_BRANCH: ${{ github.ref_name }}
        run: env PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/bash < scripts/ios-try.sh
      - name: 团队 ID 通过 ios/local.xcconfig 传给签名设置
        working-directory: ${{ runner.temp }}/laiganjue
        run: |
          printf 'DEVELOPMENT_TEAM = TESTTEAM00\n' > ios/local.xcconfig
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -showBuildSettings | grep -E '^ *DEVELOPMENT_TEAM = TESTTEAM00$'
          git status --porcelain --untracked-files=all
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: 诊断信息（devicectl）
        continue-on-error: true
        run: |
          xcrun devicectl list devices --json-output "$RUNNER_TEMP/devices.json" && cat "$RUNNER_TEMP/devices.json"
          xcrun devicectl device process launch --help | head -n 60
          xcrun devicectl device install app --help | head -n 30
          xcodebuild -help 2>&1 | grep -i -A2 provisioning
          xcodebuild -showsdks
